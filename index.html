<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            🚀 AI Hub
        </div>


        <nav>

            <a class="active">
                🏠 Home
            </a>

            <a>
                🤖 AI Chat
            </a>

            <a href="browser.html">
                🌐 Browser
            </a>

            <a>
                🎨 Image Generator
            </a>

            <a>
                ⚙ Settings
            </a>

        </nav>


        <div class="profile">
            👤 Prince
        </div>


    </aside>



    <!-- Main Area -->

    <main class="main">


        <header>

            <h1>
                Welcome to AI Hub 🚀
            </h1>

            <p>
                Your personal AI workspace
            </p>

        </header>



        <section class="cards">


            <div class="card">

                <h2>
                    🤖 AI Chat
                </h2>

                <p>
                    Talk with your AI assistant.
                </p>

                <button>
                    Open
                </button>

            </div>



            <div class="card">

                <h2>
                    🌐 AI Browser
                </h2>

                <p>
                    Explore supported content inside AI Hub.
                </p>

                <a href="browser.html">
                    <button>
                        Open
                    </button>
                </a>

            </div>




            <div class="card">

                <h2>
                    🎨 Image Studio
                </h2>

                <p>
                    Create and manage images.
                </p>

                <button>
                    Open
                </button>

            </div>


        </section>



    </main>


</div>


<script src="script.js"></script>

</body>
</html>
